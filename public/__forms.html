<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Contact form registration</title>
  </head>
  <body>
    <form
      name="saleschild-contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="saleschild-contact" /><input
        name="name"
        type="text"
      /><input name="email" type="email" /><input name="organization" type="text" /><textarea
        name="message"
      ></textarea
      ><input name="consent" type="checkbox" value="yes" /><input name="bot-field" type="text" />
    </form>
  </body>
</html>
