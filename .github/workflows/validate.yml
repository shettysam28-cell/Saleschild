name: Validate Saleschild source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm run verify:repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run security:repo
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npm run security:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:import:e2e
      - run: npm audit --audit-level=high
    # Deliberately no publish job. First public deployment requires user approval.
